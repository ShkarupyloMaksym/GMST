[project]
name = "gmst"
version = "0.0.1"
description = "Real-time speech-to-text for Google Meet via faster-whisper"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "faster-whisper>=1.1",
    "sounddevice>=0.5",
    "soundfile>=0.12",
    "av>=12",
    "soxr>=0.5",
    "numpy>=1.26",
]

[project.scripts]
gmst = "gmst.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gmst"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# review/ holds frozen evidence probes (never edited after their node reports)
extend-exclude = ["review"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not slow'"
markers = [
    "slow: downloads a model or needs a GPU; deselected by default (run with -m slow)",
]
